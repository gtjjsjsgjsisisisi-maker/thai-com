<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าเว็บของฉัน</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            color: #1a1a1a;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 12px;
        }
        p {
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        button {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0051b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>สวัสดีครับ</h1>
        <p>นี่คือหน้าเว็บพื้นฐานที่พร้อมใช้งาน คุณสามารถใส่ข้อความและส่วนประกอบต่างๆ เพิ่มเติมได้ที่นี่</p>
        <button onclick="alert('ปุ่มทำงานแล้ว!')">คลิกที่นี่</button>
    </div>

</body>
</html>
